<!doctype html>

<html>

    <head>
        <title>FuelChat</title>
        <link rel="stylesheet" href="css/style.css"><!--on indique qu'on relie avec un fichier de type stylesheet(css) et la ref est style.css qui 
                                                       est le nom du fichiers-->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>                                              
        <script src="js/auth.js" defer></script> <!--on relie à la page auth.js pour la connexion-->
    </head>                                        
    <body class="page-accueil">
    <main class="accueil-layout">

        <section class="accueil-gauche">
          <h1><span class="logo-essence">⛽</span>FuelChat</span></h1>

          <h2>Vos conversations prennent de la vitesse.</h2>

        </section>

    <section class="accueil-droite">
        <div class="auth-card">

    <h3>Bienvenue !</h3>
    <p class="auth-sous-titre">
    Connectez-vous pour retrouver vos amis et </p>
    <p class="auth-sous-titre">
    poursuivre vos discussions auto & moto.</p>
    <form> <!-- Champs de texte -->
    <p>
    <label for="username">Nom d'utilisateur (pour l'inscription)</label>
    <input
        type="text"
        id="username"
        minlength="3"
        maxlength="40"
        autocomplete="username"
        placeholder="Ex : alex237"
    >
</p>
    <p><label for="email">Adresse courriel</label> <input type="email" id="email" required></p>
    <p><label for="password">Mot de passe</label> <input type="password" id="password" required></p>
    <label for="checkbox"> se souvenir de moi</label><input type="checkbox" id="checkbox">

    <p><button type="button" id="connexion"> se connecter</button></p>
    <p><button  type="button" id="inscription"> s'inscrire</button></p>
     <P> <a href="motdepasse.html"> Mot de passe oublie ? </a> </P>

    </form>

            </div>
    </section>
</main>
    </body>

</html>
