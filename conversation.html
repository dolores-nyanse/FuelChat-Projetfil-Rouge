<html>

      <link rel="stylesheet" href="style.css?v=2">

    <div><button onclick="window.location.href='parametre.html'">Settings</button></div>

    <div><button onclick="window.location.href='conversation.html'">Chats</button></div>
    <!-- MODIFIÉ : l'alert est remplacé par un id, le comportement est dans script.js -->

    <!-- AJOUT : liste des chats (remplie par script.js) -->
    <div id="listeChats"></div>
</div>

    </div>
</div>
