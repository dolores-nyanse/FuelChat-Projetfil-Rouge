
<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Carburant - FuelChat</title>

    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem("theme") || "sombre";
    </script>

    <link rel="stylesheet" href="carburant.css">
</head>

<body>

<div id="application">

    <!-- Barre latérale -->
    <aside id="Navigation">

        <div class="logo">
            <svg class="ico" viewBox="0 0 24 24">
                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
            </svg>
            <span>Fuel<b>Chat</b></span>
        </div>

        <nav class="menu">
            <a class="lienMenu" href="index.html">
                Accueil
            </a>

            <a class="lienMenu" href="conversation.html">
                Chats
            </a>

            <a class="lienMenu" href="contacts.html">
                Contacts
            </a>

            <a class="lienMenu actif" href="carburant.html">
                Carburant
            </a>

            <a class="lienMenu" href="parametre.html">
                Paramètres
            </a>
        </nav>

    </aside>

    <!-- Contenu principal -->
    <main id="Carburant">

        <header class="entete">
            <h1>Carburant</h1>
            <p>
                Estimez le coût de vos déplacements
                et trouvez les stations-service
                les plus avantageuses.
            </p>
        </header>

        <!-- Formulaire d'estimation du trajet -->
        <section class="carte">

            <h2>Estimation de trajet</h2>

            <form id="formulaireTrajet">

                <div class="champ">
                    <label for="depart">
                        Lieu de départ
                    </label>
                    <input
                        type="text"
                        id="depart"
                        placeholder="Ex. : Chicoutimi"
                        required>
                </div>

                <div class="champ">
                    <label for="destination">
                        Destination
                    </label>
                    <input
                        type="text"
                        id="destination"
                        placeholder="Ex. : Montréal"
                        required>
                </div>

                <div class="champ">
                    <label for="consommation">
                        Consommation du véhicule (L/100 km)
                    </label>
                    <input
                        type="number"
                        id="consommation"
                        min="0.1"
                        step="0.1"
                        placeholder="Ex. : 7.5"
                        required>
                </div>

                <div class="champ">
                    <label for="typeCarburant">
                        Type de carburant
                    </label>
                    <select id="typeCarburant" required>
                        <option value="">
                            Choisir un carburant
                        </option>
                        <option value="ordinaire">
                            Ordinaire
                        </option>
                        <option value="super">
                            Super
                        </option>
                        <option value="diesel">
                            Diesel
                        </option>
                    </select>
                </div>

                <!-- Distance de secours si l'API échoue -->
                <div class="champ">
                    <label for="distanceManuelle">
                        Distance manuelle (km) — facultatif
                    </label>
                    <input
                        type="number"
                        id="distanceManuelle"
                        min="0.1"
                        step="0.1"
                        placeholder="Si le calcul automatique échoue">
                </div>

                <button type="submit" id="boutonCalculer">
                    Calculer mon trajet
                </button>

            </form>

            <!-- Résultats du calcul -->
            <div id="resultatTrajet" hidden></div>

        </section>

        <!-- Recherche des stations-service -->
        <section class="carte">

            <h2>Stations-service à proximité</h2>

            <p>
                Les stations recommandées
                apparaîtront ici.
            </p>

        </section>

    </main>

</div>

<script src="carburant.js"></script>

</body>
</html>
