<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacts - FuelChat</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="contacts.js" defer></script>
    </head>
    <body class="page-contacts">

<div id="contacts">

    <h1>Mes contacts FuelChat</h1>

    <!-- Recherche des utilisateurs -->
    <div id="recherche">
        <label for="rechercheContact">
            Rechercher un utilisateur
        </label>

        <input
            type="search"
            id="rechercheContact"
            placeholder="Nom d'utilisateur"
        >

        <button type="button" id="boutonRecherche">
            Rechercher
        </button>
    </div>

    <!-- Résultats de recherche -->
    <h2>Résultats de recherche</h2>
    <div id="resultatsRecherche"></div>

    <!-- Contacts enregistrés -->
    <h2>Ma liste de contacts</h2>
    <div id="listecontacts"></div>

    <!-- Navigation -->
    <p>
        <a href="conversation.html">Conversations</a>
    </p>

</div>

    </body>
</html>
