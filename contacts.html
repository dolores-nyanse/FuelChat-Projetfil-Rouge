<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Contacts - FuelChat</title>

    <!-- Applique le thème choisi dans Paramètres (sombre ou clair) -->
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem("theme") || "sombre";
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contacts-mobile.css?v=6">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/contacts.js"></script>
</head>

<body class="page-contacts">
    <div class="contacts-app">

        <aside class="contacts-sidebar">
            <div class="contacts-logo">Fuel<span>Chat</span></div>

            <nav class="contacts-menu">
                <a href="conversation.html" class="menu-link">Chats</a>
                <a href="contacts.html" class="menu-link actif">Contacts</a>
                <a href="carburant.html" class="menu-link menu-link-carburant">Carburant</a>
                <a href="parametre.html" class="menu-link">Paramètres</a>
            </nav>

            
        </aside>

        <main id="contacts" class="contacts-main">

            <h1>Mes contacts</h1>

            <!-- Recherche des utilisateurs -->
            <div id="recherche">
                <label for="rechercheContact" style="font-size: 30px;">🔍</label>
                

                <input
                    type="search"
                    id="rechercheContact"
                    placeholder="Rechercher ou ajouter un contact"
                >

                <button type="button" id="boutonRecherche">
                    Rechercher
                </button>
            </div>

            <!-- Résultats de recherche -->
            <h2>Résultats de recherche</h2>
            <div id="resultatsRecherche"></div>

            <!-- Invitations reçues -->
            <h2>Invitations reçues</h2>
            <div id="invitationsRecues"></div>

            <!-- Invitations envoyées -->
            <h2>Invitations envoyées</h2>
            <div id="invitationsEnvoyees"></div>

            <!-- Contacts enregistrés -->
            <h2>Liste de contacts</h2>
            <div id="listecontacts"></div>

        </main>
    </div>
</body>
</html>
